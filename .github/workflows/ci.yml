name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        if: matrix.node-version == '20.x'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  e2e:
    name: End-to-end (real Chrome, extension loaded)
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Loads the repository root as an unpacked extension. No build step and no
      # API key: provider calls are intercepted by the test.
      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  package:
    name: Package extension
    runs-on: ubuntu-latest
    needs: [verify, e2e]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build bundles
        run: npm run build

      # The loadable extension is the repository root, not dist/ — dist/ holds
      # only bundled JS with no manifest or HTML.
      - name: Create unpacked extension zip
        run: |
          zip -r genai-browser-tool.zip . \
            -x 'node_modules/*' 'tests/*' 'docs/*' '.git/*' '.github/*' \
               'dist/*' 'coverage/*' 'playwright-report/*' '*.config.js'

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: genai-browser-tool-extension
          path: genai-browser-tool.zip
          retention-days: 14
