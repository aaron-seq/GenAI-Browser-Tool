name: CI

on:
  push:
    branches: [main]
  # No `branches:` filter — a stacked PR whose base is another feature branch
  # must still be checked. Filtering on [main] silently gave those PRs no checks
  # at all, which looks identical to "nothing to run".
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  pr-base:
    name: PR base is still active
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Reject an already merged base branch
        env:
          PR_BASE_BRANCH: ${{ github.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node .github/scripts/check-pr-base.mjs

  verify:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        if: matrix.node-version == '22.x'
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        if: matrix.node-version == '22.x'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  e2e:
    name: End-to-end (real Chrome, extension loaded)
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Loads the repository root as an unpacked extension. No build step and no
      # API key: provider calls are intercepted by the test.
      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  package:
    name: Package extension
    runs-on: ubuntu-latest
    needs: [verify, e2e]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Explicit inputs keep legacy dist/, local secrets, and tooling out of
      # the package even when they exist in a developer's checkout.
      - name: Create unpacked extension zip
        run: |
          zip -r genai-browser-tool.zip \
            manifest.json background.js content.js options.js \
            options.html options.css popup.html \
            assets core providers scripts services styles utils README.md LICENSE

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: genai-browser-tool-extension
          path: genai-browser-tool.zip
          retention-days: 14
